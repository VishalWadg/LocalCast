name: LocalCast Android CI/CD (Main Branch APK Build)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Debug APK & Run Unit Tests (M0–M4 · API 37 / AGP 9.1.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Accept Android SDK Licenses & Install API 37 Platform
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" || true
          # Install Android 17 (API 37) platform
          sdkmanager "platforms;android-37" || sdkmanager "platforms;android-37.0" || true
          sdkmanager "build-tools;37.0.0" || true

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run M0–M4 Unit Tests
        run: gradle :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Assemble Debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Stage APK Deliverable
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LocalCast-poc-v0.1.0-debug.apk
          ls -lh dist/LocalCast-poc-v0.1.0-debug.apk

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LocalCast-poc-v0.1.0-debug-apk
          path: dist/LocalCast-poc-v0.1.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish Automated GitHub Release on Push to main (No Manual Tag Needed)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: main-latest
          name: "LocalCast POC v0.1 Automated Build (main #${{ github.run_number }})"
          body: |
            Automated Debug APK build from `main` branch commit `${{ github.sha }}`.
            - **Milestones included:** M0 (WebRTC Native Engine Init) + M1 (Wi-Fi Binding & Ktor Local WebSocket Signaling) + M2 (WebRTC SDP Offer/Answer & Local Host-Candidate ICE) + M3 (Camera2 720p/480p + Microphone Streaming & Compose SurfaceViewRenderer) + M4 (StreamingForegroundService & Ongoing Notification)
            - **Toolchain:** AGP 9.1.1 · Gradle 9.3.1 · Kotlin 2.4.21 · JDK 17 · Compile/Target SDK 37 · Min SDK 29
          files: dist/LocalCast-poc-v0.1.0-debug.apk
          prerelease: true
          make_latest: "false"

      - name: Send APK to Telegram Group
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing from repository secrets!"
            exit 1
          fi

          echo "Preparing Telegram release notification..."
          CAPTION="🚀 <b>New LocalCast Release: v0.1.0-poc</b>"$'\n'
          CAPTION+="A new Android build has been built and published!"$'\n\n'
          CAPTION+="<b>What's New:</b>"$'\n'
          CAPTION+="• WebRTC native engine initialization (M0)"$'\n'
          CAPTION+="• Local Wi-Fi socket signaling via Ktor (M1)"$'\n'
          CAPTION+="• WebRTC SDP offer/answer & local host-candidate ICE (M2)"$'\n'
          CAPTION+="• Camera2 720p/480p & mic live streaming (M3)"$'\n'
          CAPTION+="• StreamingForegroundService & ongoing persistent notification (M4)"$'\n\n'
          CAPTION+="📥 <a href=\"https://github.com/${{ github.repository }}/releases/download/main-latest/LocalCast-poc-v0.1.0-debug.apk\">Direct APK Download</a>"$'\n'
          CAPTION+="🌐 <a href=\"https://github.com/${{ github.repository }}/releases/tag/main-latest\">GitHub Release Notes</a>"

          APK_PATH="dist/LocalCast-poc-v0.1.0-debug.apk"
          FILE_SIZE=$(wc -c < "$APK_PATH" | tr -d ' ')
          echo "Staged APK Size: $FILE_SIZE bytes"

          # Telegram Bot API enforces a strict 50 MB limit for direct sendDocument uploads
          MAX_BYTES=50000000

          if [ "$FILE_SIZE" -le "$MAX_BYTES" ]; then
            echo "APK is within 50MB ceiling. Sending document directly to Telegram chat ID: $TELEGRAM_CHAT_ID..."
            RESPONSE=$(curl -s -S \
              -F "chat_id=$TELEGRAM_CHAT_ID" \
              -F "document=@$APK_PATH" \
              -F "caption=$CAPTION" \
              -F "parse_mode=HTML" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument")
          else
            echo "APK exceeds 50MB Telegram ceiling ($FILE_SIZE bytes). Sending release announcement card via sendMessage..."
            RESPONSE=$(curl -s -S \
              -F "chat_id=$TELEGRAM_CHAT_ID" \
              -F "text=$CAPTION" \
              -F "parse_mode=HTML" \
              "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage")
          fi

          echo "Telegram Response: $RESPONSE"

          if ! echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "::error::Telegram delivery failed: $RESPONSE"
            exit 1
          fi

          echo "Telegram delivery succeeded!"
